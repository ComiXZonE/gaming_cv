career-profile:
  title: Summary
  summary: |
    Embedded software engineer with experience in real-time systems, C++ development and performance-critical execution.
    Background spans constrained embedded hardware (ADAS SoCs), CNN runtime development, and large-scale game engine systems, all sharing a common thread: predictable, low-latency execution under tight resource constraints.
    Experienced in memory management, real-time scheduling, cross-platform development and integrating software layers across hardware and application boundaries.

education:
  title: Education
  info:
  - degree: BSc in Computer Science and Information Technology
    university: School of Electrical Engineering, University of Belgrade
    time: 2013 - 2017

experiences:
  title: Experience
  info:
  - role: Senior Programmer
    time: November 2024 - Present
    company: Ubisoft, Belgrade
    details: |
      - Shipped Animus Hub across Assassin's Creed Shadows and Black Flag Resynced, a cross-title in-game portal unifying progression tracking, content discovery, upsell and preorder flows
      - Implemented the IPC layer between Ultralight (a GPU-accelerated renderer embedded in Ubisoft's Anvil engine) and the game runtime: heartbeat timers, event dispatch, bidirectional data exchange and state synchronization
      - Built real-time data pipelines exposing live game state to the UI layer, with minimal per-frame overhead
      - Owned end-to-end delivery of features within a multi-platform runtime environment (PC, PS5, Xbox Series X)
      - Mentored and onboarded engineers on engine workflows and codebase conventions
  - role: UI Programmer
    time: January 2021 - November 2024
    company: Ubisoft, Belgrade
    details: |
      - Developed the founding prototype of Animus Hub, defining the initial system architecture and cross-subsystem integration contracts that shaped its production design
      - Implemented C++ component logic within Ubisoft's Anvil engine, transforming gameplay state into compact data structures optimized for real-time, frame-budget-aware execution
      - Delivered and maintained cross-platform compatibility across PC, PS5, Xbox Series X and Google Stadia, meeting platform certification requirements for each target
      - Owned the Maintenance mode feature for Skull and Bones: a runtime state machine blocking game access during server downtime with live countdown to service restoration
      - Defined data contracts and integration protocols with art teams, reducing pipeline friction and iteration overhead across a multi-discipline production team
  - role: Embedded Software Engineer
    time: October 2017 - December 2020
    company: RT-RK, Belgrade
    details: |
      - Built a Caffe model conversion pipeline in Python for a proprietary neural network accelerator, reduced models to hardware-supported node types and fused operation sequences (convolution, pooling, ReLU) into single accelerator cycles
      - Developed an execution and memory scheduler in C that resolved layer-by-layer execution order and address-mapped buffer assignments into a custom binary, flashed via ARM core and consumed by the board's accelerator
      - Built video capture and storage pipelines on embedded Linux using a Switchtec PCIe switch, hot-swappable SSD rack and ROS2; recorded multi-modal video and CAN bus streams for computer vision training datasets
      - Participated in bringup of the video capture board, read the Switchtec PCIe switch datasheet to verify pin configuration for optimal lane assignment and validated software-side device enumeration and configuration
      - Reduced integral image execution time from 23ms to 16ms per 720p frame on TI TDA2x ADAS SoC through algorithmic and memory access pattern improvements
  - role: Intern
    time: February 2017 - September 2017
    company: RT-RK, Belgrade
    details: |
      - Completed BSc thesis on optimization of program execution on TI C66x DSP using the Enhanced DMA Controller
      - Interfaced with the development board via UART and utilized JTAG for on-target debugging
      - Introduced to embedded development on TI TDA2x ADAS SoC via TI VisionSDK; learned DMA-based optimization techniques and double-buffering patterns

