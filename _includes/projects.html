{% assign projects = site.data.data.projects %}
{% if projects %}
<section class="section projects-section">

  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-archive fa-stack-1x fa-inverse"></i>
    </span>
    {{ projects.title }}
  </h2>

  {% if projects.intro %}
  <div class="intro">
      <p>{{ projects.intro }}</p>
  </div><!--//intro-->
  {% endif %}

  {% for project in projects.assignments %}
    <div class="item" style="display:flex;align-items:baseline;gap:0.4em;">{% if project.tagline %}<span style="flex-shrink:0;">&bull;</span><span class="project-tagline">{{ project.tagline }}</span>{% endif %}</div>
  {% endfor %}

</section><!--//section-->
{% endif %}
